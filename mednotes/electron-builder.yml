appId: app.medica.mednotes
productName: MedNotes

directories:
  buildResources: build
  output: dist

files:
  - electron/**/*
  - renderer/**/*
  - services/**/*
  - package.json

extraResources:
  - from: models
    to: models

asarUnpack:
  - node_modules/onnxruntime-node/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

protocols:
  - name: MedNotes
    schemes:
      - mednotes

mac:
  files:
    - electron/**/*
    - renderer/**/*
    - services/**/*
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/**'
  x64ArchFiles: "**/node_modules/{onnxruntime-node,sharp,@img}/**/*.{node,dylib}"
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  artifactName: MedNotes-${version}-universal.${ext}

win:
  files:
    - electron/**/*
    - renderer/**/*
    - services/**/*
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
  target:
    - target: nsis
      arch:
        - x64
        - arm64

dmg:
  backgroundColor: "#edf8f2"
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
